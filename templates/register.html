<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPrep | Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="glass-card">

        <h1>SmartPrep</h1>

        <p class="tagline">
            Create Your Student Account
        </p>

        {% if error %}
        <div class="error-message">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST">

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    name="fullname"
                    placeholder="Full Name"
                    required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="reg_password"
                    name="password"
                    placeholder="Password"
                    required>

                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('reg_password', this)" aria-label="Toggle password visibility">
                    <i class="fa-solid fa-eye"></i>
                </button>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="reg_confirm_password"
                    name="confirm_password"
                    placeholder="Confirm Password"
                    required>

                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('reg_confirm_password', this)" aria-label="Toggle confirm password visibility">
                    <i class="fa-solid fa-eye"></i>
                </button>

            </div>

            <button type="submit" class="register-btn">
            Register
            </button>

        </form>

        <p class="register-text">

            Already have an account?

            <a href="/login">Login</a>

        </p>

    </div>

</div>

<script>
function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        if (icon) {
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        }
    } else {
        input.type = 'password';
        if (icon) {
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
}
</script>

</body>
</html>
