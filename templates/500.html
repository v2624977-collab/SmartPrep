<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 | Server Error</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh;">

<div class="circle circle1" style="background:#DC2626;"></div>
<div class="circle circle2"></div>

<div class="glass-card" style="text-align:center; max-width:500px; padding:50px 30px;">
    <div style="font-size:70px; color:#EF4444; margin-bottom:15px; font-weight:800;">500</div>
    <h2 style="margin-bottom:10px; color:#F8FAFC;">Internal Server Error</h2>
    <p style="color:#94A3B8; margin-bottom:25px; line-height:1.6;">{{ message if message else 'An unexpected error occurred while processing your request.' }}</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-start" style="display:inline-flex; padding:12px 26px;">
        <i class="fa-solid fa-house"></i> Return to Dashboard
    </a>
</div>

</body>
</html>
